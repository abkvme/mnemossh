[package]
name = "mnemossh"
version = "0.1.14"
edition = "2024"
authors = ["Ales Bykau <abkvme>"]
description = "A library and CLI tool for generating and managing Ed25519 SSH keys using BIP-39 mnemonic phrases"
license = "MIT"
repository = "https://github.com/abkvme/mnemossh"
keywords = ["ssh", "mnemonic", "bip39", "ed25519", "cli"]
categories = ["command-line-utilities", "cryptography"]

[lib]
name = "mnemossh"
path = "src/lib.rs"

[[bin]]
name = "mnemossh"
path = "src/main.rs"

[dependencies]
# Cryptography
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["pkcs8", "pem", "digest", "zeroize"] }
tiny-bip39 = "2.0.0"
base64 = "0.23.1"
rand = "0.10.2"
sha2 = "0.11.0"
md5 = "0.8.1"
bcrypt-pbkdf = "0.11.0"
aes = "0.9.3"
ctr = "0.10.1"
zeroize = { version = "1.9.0", features = ["zeroize_derive"] }
time = { version = "0.3.55", features = ["local-offset"] }

# CLI
clap = { version = "4.6.7", features = ["derive"] }
dialoguer = "0.12.0"
console = { version = "0.16.6", default-features = false }

# Error handling
thiserror = "2.0.20"
anyhow = "1.0.104"

# File handling
directories = "6.0.0"

[dev-dependencies]
tempfile = "3.27.0"
hex = "0.4.3"
assert_fs = "1.1.4"
clap = { version = "4.6.7", features = ["derive"] }
